<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>SQL Injection 互動教學評分系統</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Consolas, monospace; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        h1 { color: #00ff66; border-bottom: 2px solid #00ff66; padding-bottom: 10px; }
        .nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav button { padding: 10px 20px; background: #1f1f1f; border: 1px solid #333; color: #888; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .nav button.active { background: #00ff66; color: #000; border-color: #00ff66; }
        .panel { display: none; background: #1e1e1e; padding: 20px; border-radius: 6px; border: 1px solid #333; margin-bottom: 20px; }
        .panel.active { display: block; }
        input, button { padding: 10px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; }
        button.action { background: #00ff66; color: #000; font-weight: bold; cursor: pointer; border: none; }
        pre { background: #000; padding: 15px; border-radius: 4px; color: #00e5ff; overflow-x: auto; border: 1px solid #222; }
        .flag-box { margin-top: 30px; background: #261c00; border: 1px solid #ffb700; padding: 15px; border-radius: 6px; }
    </style>
</head>
<body>

    <h1>🛡️ SQL Injection 互動教學系統</h1>

    <div class="nav">
        <button class="active" onclick="switchLab(1)">Lab 1: Auth Bypass</button>
        <button onclick="switchLab(2)">Lab 2: UNION 跨表撈取</button>
    </div>

    <!-- Lab 1 Panel -->
    <div id="lab1" class="panel active">
        <h2>Lab 1: 驗證繞過 (Auth Bypass)</h2>
        <p><strong>目標：</strong> 輸入特定 SQLi 語法破壞背景驗證邏輯，成功以 <code>admin</code> 身份登入。</p>
        <hr><br>
        <label>Username: </label>
        <input type="text" id="l1_user" value="admin' --" style="width: 300px;"><br><br>
        <label>Password: </label>
        <input type="password" id="l1_pass" value="anything"><br><br>
        <button class="action" onclick="submitLab1()">送出 Payload</button>
    </div>

    <!-- Lab 2 Panel -->
    <div id="lab2" class="panel">
        <h2>Lab 2: UNION Injection 資料撈取</h2>
        <p><strong>目標：</strong> 利用 <code>UNION SELECT</code> 跨表查詢撈取隱藏在 <code>secret_flags</code> 資料表中的 Flag。</p>
        <hr><br>
        <label>Search User ID: </label>
        <input type="text" id="l2_id" value="1 UNION SELECT 1, flag_value, 'flag' FROM secret_flags" style="width: 450px;"><br><br>
        <button class="action" onclick="submitLab2()">搜尋數據</button>
    </div>

    <!-- 伺服器 Console 輸出區 -->
    <h3>🖥️ 後端回應與數據監控 (Response Inspector)</h3>
    <pre id="console">等待發送 Payload...</pre>

    <!-- Flag 提交評分區 -->
    <div class="flag-box">
        <h3>🚩 關卡 Flag 評分驗證</h3>
        <input type="text" id="flag_input" placeholder="FLAG{...}" style="width: 350px;">
        <button class="action" onclick="verifyFlag()">提交驗證</button>
        <span id="flag_result" style="margin-left: 15px; font-weight: bold;"></span>
    </div>

    <script>
        const sessionId = "user_" + Math.random().toString(36).substring(7);

        function switchLab(num) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(`lab${num}`).classList.add('active');
            event.target.classList.add('active');
        }

        async function submitLab1() {
            const username = document.getElementById('l1_user').value;
            const password = document.getElementById('l1_pass').value;
            const res = await fetch('/api/lab1/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-session-id': sessionId },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            document.getElementById('console').innerText = JSON.stringify(data, null, 2);
        }

        async function submitLab2() {
            const id = encodeURIComponent(document.getElementById('l2_id').value);
            const res = await fetch(`/api/lab2/search?id=${id}`, {
                headers: { 'x-session-id': sessionId }
            });
            const data = await res.json();
            document.getElementById('console').innerText = JSON.stringify(data, null, 2);
        }

        async function verifyFlag() {
            const user_flag = document.getElementById('flag_input').value;
            const res = await fetch('/api/verify_flag', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-session-id': sessionId },
                body: JSON.stringify({ user_flag })
            });
            const data = await res.json();
            document.getElementById('flag_result').innerText = data.message;
            document.getElementById('flag_result').style.color = data.success ? '#00ff66' : '#ff4444';
        }
    </script>
</body>
</html>
