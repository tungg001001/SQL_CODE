version: '3.8'

services:
  sqli-api:
    build: ./sqli-backend
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - sandbox_net

  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sqli-api
    networks:
      - sandbox_net

networks:
  sandbox_net:
    driver: bridge
